<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Primeiro projeto</title>
</head>

<body>
    <header>
        <div class="logo">Dev Store</div>
        <nav>
            <ul>
                <li>home</li>
                <li>produtos</li>
                <li>contatos</li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="tech-circle">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
        </div>

        <div class="list">
            <div class="item active">

                <div class="product-img">
                    <img src="./imagens/apple-watch.png" alt="apple watch">
                </div>
                <div class="content">
                    <p class="product-tag">Novo Lançamento</p>
                    <p class="product-name">Apple watch series 10</p>
                    <p class="descripition">
                        O smartwatch mais avançado do mercado.
                    </p>
                    <button class="btn">Saiba Mais</button>
                </div>
            </div>

            <div class="item">
                <div class="product-img">
                    <img src="./imagens/air-pods.png" alt="air pods max">
                </div>
                <div class="content">
                    <p class="product-tag">Som premium</p>
                    <p class="product-name">air pods max</p>
                    <p class="descripition">
                        Experimente o som em sua forma mais pura.
                    </p>
                    <button class="btn">Saiba Mais</button>
                </div>

            </div>
            <div class="item">
                <div class="product-img">
                    <img src="./imagens/vision-pro.png" alt="vision pro">
                </div>
                <div class="content">
                    <p class="product-tag">Alta performance</p>
                    <p class="product-name">vision pro</p>
                    <p class="descripition">
                        Realidade aumentada imersiva com o Apple Vision Pro.
                    </p>
                    <button class="btn">Saiba Mais</button>
                </div>

            </div>
        </div>

        <div class="arrows">
            <button class="arrow-btn" id="prev">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#fff"
                    class="bi bi-arrow-left-circle-fill" viewBox="0 0 16 16">
                    <path
                        d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0m3.5 7.5a.5.5 0 0 1 0 1H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5z" />
                </svg>
            </button>
            <button class="arrow-btn" id="next">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#fff"
                    class="bi bi-arrow-right-circle-fill" viewBox="0 0 16 16">
                    <path
                        d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0M4.5 7.5a.5.5 0 0 0 0 1h5.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5z" />
                </svg>

            </button>

        </div>

        <div class="indicators">
            <div class="numbers">01</div>
            <div class="dots">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>

            </div>
    </main>
</body>
<script src="./script.js"></script>

</html>
